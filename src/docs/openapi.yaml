openapi: 3.0.0

info:
  title: Tamper Evident Log Service
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:

  /log:

    post:

      summary: Create Log

      security:
        - ApiKeyAuth: []

      requestBody:
        required: true

      responses:
        "201":
          description: Created

  /log/{id}:

    get:
      summary: Get Log

  /log/verify:

    get:
      summary: Verify Chain

  /log/export:

    get:
      summary: Export Logs

components:

  securitySchemes:

    ApiKeyAuth:

      type: apiKey

      in: header

      name: x-api-key
