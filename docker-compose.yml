version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: tamper-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tamperlog

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .

    container_name: tamper-api

    depends_on:
      - postgres

    ports:
      - "3000:3000"

    env_file:
      - .env

volumes:
  postgres-data: